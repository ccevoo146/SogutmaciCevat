<!DOCTYPE html>

<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Girişi - Soğutmacı Cevat</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #eefaff;
        }

        .login-box {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 40px 30px;

            border-radius: 18px;

            box-shadow:
                0 20px 50px
                rgba(16, 42, 67, 0.12);

            text-align: center;
        }

        .logo {

            width: 90px;

            height: 90px;

            object-fit: contain;

            margin-bottom: 15px;
        }

        h1 {

            margin-bottom: 8px;

            color: #102a43;

        }

        p {

            color: #627d98;

            margin-bottom: 25px;

        }

        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d9e2ec;

            border-radius: 8px;

            font-size: 15px;

            margin-bottom: 15px;

            outline: none;
        }

        input:focus {

            border-color: #087ea4;

        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #087ea4;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {

            background: #056783;

        }

        .error {

            color: #c53030;

            margin-bottom: 15px;

        }

        .back {

            display: inline-block;

            margin-top: 20px;

            color: #087ea4;

            text-decoration: none;

            font-size: 14px;

        }

    </style>

</head>


<body>


<div class="login-box">


    <img
        src="{{ url_for('static', filename='images/logo.png') }}"
        class="logo"
        alt="Soğutmacı Cevat">


    <h1>
        Admin Girişi
    </h1>


    <p>
        Servis yönetim paneline giriş yapın.
    </p>


    {% if hata %}

        <div class="error">
            {{ hata }}
        </div>

    {% endif %}


    <form method="POST">

        <input
            type="password"
            name="sifre"
            placeholder="Admin şifresi"
            required>

        <button type="submit">
            Giriş Yap
        </button>

    </form>


    <a href="/" class="back">
        ← Ana Sayfaya Dön
    </a>


</div>


</body>

</html>
